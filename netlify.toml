# Netlify serves the Angular client. The .NET API cannot run on Netlify, so it
# stays on its own host (Render) and Netlify proxies /api to it. Because the
# proxy is server-side, the browser still talks to a single origin: the client's
# API_BASE_URL stays '/api' and the API needs no CORS change.

[build]
  base = "src/frontend/office-system-web"
  command = "npm run build -- --configuration production"
  publish = "dist/office-system-web/browser"

[build.environment]
  NODE_VERSION = "22"

# Proxy the API to its Render service.
[[redirects]]
  from = "/api/*"
  to = "https://officetrackingsystem.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: deep links such as /teams/42 load index.html and let the
# Angular router take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
